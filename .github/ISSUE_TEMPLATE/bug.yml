name: 缺陷报告
description: 反馈可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: issue
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 观察…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 浏览器、窗口尺寸等
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息
